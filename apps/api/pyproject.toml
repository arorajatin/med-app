[project]
name = "med-app-backend"
version = "0.1.0"
description = "Private-by-default medical records backend with AI-assisted extraction."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.2.3,<4.0.0",
    "pyjwt[crypto]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.35",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0.0,<3.0.0",
    "mypy>=1.15.0,<2.0.0",
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0,<8.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
